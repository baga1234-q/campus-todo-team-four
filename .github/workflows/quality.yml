# 质量门禁流水线（Sprint3 / Lab6-7）
# 触发：push 到 main 及针对 main 的所有 PR
# 门禁规则：
#   - 本地：JaCoCo 行覆盖率 > 70%、分支覆盖率 > 60%（pom.xml 中 jacoco check 强制执行）
#   - Sonar：Bugs = 0、Vulnerabilities = 0（Sonar 质量门禁，wait=true 失败即红）
name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build, test and enforce coverage gate
        run: mvn -B verify
        # verify 阶段触发 JaCoCo check；覆盖率不达标时本步失败，阻止合并

      - name: Sonar scan (Bugs=0, Vulnerabilities=0)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          args="sonar:sonar -Dsonar.token=${SONAR_TOKEN} -Dsonar.qualitygate.wait=true"
          if [ -n "${SONAR_HOST_URL}" ]; then
            args="${args} -Dsonar.host.url=${SONAR_HOST_URL}"
          fi
          mvn -B ${args}
