# CI/CD 部署流水线（Sprint4 / Lab8）
# 流程：build → test → sonar → 构建镜像 → 推送 GHCR → 远程部署（docker compose up）
# 触发：push 到 main
name: deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # 推送 GHCR 镜像需要

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

      - name: Sonar quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          args="sonar:sonar -Dsonar.token=${SONAR_TOKEN} -Dsonar.qualitygate.wait=true"
          if [ -n "${SONAR_HOST_URL}" ]; then
            args="${args} -Dsonar.host.url=${SONAR_HOST_URL}"
          fi
          mvn -B ${args}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/campustodo
            docker compose pull app
            docker compose up -d --remove-orphans
            docker system prune -f
