# Sonar 项目配置（放在仓库根目录）
# 用于 SonarCloud / SonarQube 静态扫描，与 .github/workflows/quality.yml 配合使用

sonar.projectKey=campus-todo-team-four
sonar.projectName=CampusTodo Team Four
sonar.organization=campustodo-team-four   # SonarCloud organization key，按实际填写

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo 覆盖率报告（由 jacoco-maven-plugin 生成）
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# 源码编码
sonar.sourceEncoding=UTF-8

# 忽略构建产物，避免误报
sonar.exclusions=**/target/**,**/*.json
