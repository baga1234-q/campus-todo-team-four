# Grafana 告警规则（provisioning，Grafana 9+ Unified Alerting）
# 部署后自动加载：内存 > 85%（5 分钟）、应用离线（5 分钟）、HTTP 错误率 > 5%
apiVersion: 1

groups:
  - orgId: 1
    name: CampusTodo 核心告警
    folder: CampusTodo
    interval: 1m
    rules:
      # 告警 1：JVM 堆内存使用率过高
      - uid: campustodo-memory-high
        title: JVM 堆内存使用率过高
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                100 * jvm_memory_used_bytes{area="heap"} /
                jvm_memory_max_bytes{area="heap"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            type: threshold
            model:
              refId: B
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
                  operator:
                    type: and
                  query:
                    params: [A]
                  type: query
          - refId: C
            datasourceUid: __expr__
            type: reduce
            model:
              refId: C
              expression: B
              reduceMode: last
              type: reduce
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CampusTodo JVM 堆内存使用率超过 85%

      # 告警 2：应用实例离线
      - uid: campustodo-app-down
        title: CampusTodo 应用实例离线
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: up{job="campus-todo-app"}
              instant: true
          - refId: B
            datasourceUid: __expr__
            type: threshold
            model:
              refId: B
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  type: query
          - refId: C
            datasourceUid: __expr__
            type: reduce
            model:
              refId: C
              expression: B
              reduceMode: last
              type: reduce
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: CampusTodo 应用实例不可达（up < 1）

      # 告警 3：HTTP 5xx 错误率过高
      - uid: campustodo-http5xx-high
        title: HTTP 5xx 错误率过高
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                /
                sum(rate(http_server_requests_seconds_count[5m]))
                * 100
              instant: true
          - refId: B
            datasourceUid: __expr__
            type: threshold
            model:
              refId: B
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
                  operator:
                    type: and
                  query:
                    params: [A]
                  type: query
          - refId: C
            datasourceUid: __expr__
            type: reduce
            model:
              refId: C
              expression: B
              reduceMode: last
              type: reduce
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CampusTodo HTTP 5xx 错误率超过 5%
